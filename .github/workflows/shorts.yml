name: Generate YouTube Short

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Short
        run: python main.py

      - name: Save video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 30
